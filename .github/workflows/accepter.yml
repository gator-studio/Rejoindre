# Étiquette « refusé » : un mot poli, puis la demande se ferme. Étiquette « accepté » à une demande : la personne qui l'a ouverte est invitée en lecture sur le projet
# demandé, on lui répond et la demande est fermée. Seul un administrateur du dépôt peut déclencher l'invitation (vérifié ci-dessous,
# en plus de GitHub qui réserve les étiquettes aux responsables). Rien d'autre ne se déclenche : pas de code de la demande exécuté.
name: Accepter ou refuser une demande
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
jobs:
  titre:
    # Une demande arrive : son titre devient « @pseudo · projet · « message » », pour tout lire depuis la liste des demandes.
    # Le texte de la demande est lu dans l'événement par le script (jamais recopié dans une commande) : rien de ce qu'écrit
    # le demandeur n'est exécuté.
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const corps = context.payload.issue.body || '';
            const champ = (titre) => {
              const m = corps.split(/^###\s+/m).find(b => b.startsWith(titre));
              const v = m ? m.slice(titre.length).trim() : '';
              return v === '_No response_' ? '' : v;
            };
            const projet = champ('Quel projet ?') || '?';
            let mot = champ('Un petit mot (facultatif)').replace(/\s+/g, ' ');
            if (mot.length > 80) mot = mot.slice(0, 79) + '…';
            const qui = context.payload.issue.user;
            const titre = `@${qui.login} · ${projet}` + (mot ? ` · « ${mot} »` : ' · (pas de message)');
            // Le corps devient une fiche lisible (le nom du projet y reste : c'est lui que lit l'étape « Inviter »)
            const profil = (await github.rest.users.getByUsername({ username: qui.login })).data;
            const cree = new Date(profil.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
            const message = champ('Un petit mot (facultatif)');
            const fiche = [
              `<img src="${qui.avatar_url}&s=96" width="48" align="left" alt="">`,
              ``,
              `**@${qui.login}** demande l'accès à **${projet}**`,
              `<br><sub>Compte GitHub créé le ${cree} · <a href="${qui.html_url}">voir le profil</a></sub>`,
              `<br clear="left">`,
              ``,
              message ? message.split('\n').map(l => `> ${l}`).join('\n') : `> _Pas de message._`,
              ``,
              `---`,
              `**Pour décider** : à droite, *Labels* → \`accepté\` (il est invité tout de suite) ou \`refusé\` (il reçoit un mot poli).`,
            ].join('\n');
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number,
                                              title: titre, body: fiche });
  inviter:
    if: github.event.action == 'labeled' && github.event.label.name == 'accepté'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que c'est un administrateur qui accepte
        uses: actions/github-script@v7
        with:
          script: |
            const qui = context.payload.sender.login;
            const droit = await github.rest.repos.getCollaboratorPermissionLevel({ owner: context.repo.owner, repo: context.repo.repo, username: qui });
            if (droit.data.permission !== 'admin') core.setFailed(`${qui} n'est pas administrateur : pas d'invitation.`);
      - name: Inviter la personne
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INVITER }}         # seulement pour inviter (Administration du dépôt du projet)
          script: |
            const projets = { 'Tridownload (bêta)': 'Tridownload_beta', 'Tridownload': 'Tridownload' };
            const choix = Object.keys(projets).sort((a, b) => b.length - a.length).find(p => (context.payload.issue.body || '').includes(p)) || 'Tridownload (bêta)';
            await github.rest.repos.addCollaborator({ owner: context.repo.owner, repo: projets[choix], username: context.payload.issue.user.login, permission: 'pull' });
            core.exportVariable('PROJET', projets[choix]);
            core.exportVariable('PROJET_NOM', choix);
      - name: Répondre et fermer
        uses: actions/github-script@v7
        with:
          script: |
            const qui = context.payload.issue.user.login;
            const depot = process.env.PROJET;
            const lien = `https://github.com/${context.repo.owner}/${depot}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number,
              body: [
                `### C'est accepté, @${qui} !`,
                ``,
                `Bienvenue dans **${process.env.PROJET_NOM}**. Deux étapes :`,
                ``,
                `1. **Accepte l'invitation** : [${lien.replace('https://', '')}/invitations](${lien}/invitations) → **Accept invitation** (elle est aussi dans tes mails).`,
                `2. **Installe** : sur [la page du projet](${lien}), clique sur **Télécharger (ZIP)** et suis le guide.`,
                ``,
                `<sub>Une question ? Écris-moi sur Instagram : [@gator_dj](https://www.instagram.com/gator_dj)</sub>`,
              ].join('\n') });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, state: 'closed' });
  refuser:
    if: github.event.action == 'labeled' && github.event.label.name == 'refusé'
    runs-on: ubuntu-latest
    steps:
      - name: Répondre et fermer
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number,
              body: [
                `### Merci pour ta demande, @${context.payload.issue.user.login}`,
                ``,
                `Ce n'est pas possible pour l'instant.`,
                ``,
                `<sub>Tu penses qu'il y a une erreur, ou tu veux en parler ? Écris-moi sur Instagram : [@gator_dj](https://www.instagram.com/gator_dj)</sub>`,
              ].join('\n') });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, state: 'closed' });
